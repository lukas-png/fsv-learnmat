<div class="container">
    <div class="form">
        <h1>
            {{ 'signup.title' | t }}
        </h1>
        <p class="link-notice" *ngIf="linkNotice" role="status">
            {{ linkNotice | t }}
        </p>
        <p>
            {{ 'signup.intro' | t }}
            <a routerLink="/datenschutz">{{ 'signup.privacy' | t }}</a>
        </p>

        <form [formGroup]="signupForm" autocomplete="off" novalidate (ngSubmit)="signup()">
            <mat-form-field class="email-field">
                <mat-label>{{ 'signup.emailLabel' | t }}</mat-label>
                <input type="email" matInput formControlName="email" placeholder="max.mustermann@uni-hildesheim.de" email>
                <mat-hint>{{ 'signup.emailHint' | t }}</mat-hint>
                <mat-error *ngIf="hasError('email', 'required')">
                    {{ 'signup.errorRequired' | t }}
                </mat-error>
                <mat-error *ngIf="!hasError('email', 'required') && hasError('email', 'pattern') && !hasError('email', 'email')">
                    {{ 'signup.errorPattern' | t }}
                </mat-error>
                <mat-error *ngIf="!hasError('email', 'required') && hasError('email', 'email')">
                    {{ 'signup.errorEmail' | t }}
                </mat-error>
            </mat-form-field>

            <div class="actions">
                <button mat-raised-button color="primary" [disabled]="!signupForm.valid || loading">{{ 'signup.submit' | t }}</button>
            </div>
        </form>
    </div>
</div>
