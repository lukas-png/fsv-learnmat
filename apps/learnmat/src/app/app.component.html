<header (click)="home()">
  <div class="logo">
    <img src="assets/img/logo.png" alt="" />
  </div>
  <div class="text">
    <p class="title">FSV Informatik</p>
    <p class="subtitle">{{ 'header.subtitle' | t }}</p>
  </div>
  <div class="line"></div>
  <nav class="lang" [attr.aria-label]="'header.language' | t" (click)="$event.stopPropagation()">
    @for (option of languages; track option) {
      <button type="button" [class.active]="language.lang() === option" [attr.aria-pressed]="language.lang() === option"
              (click)="language.set(option)">{{ option | uppercase }}</button>
    }
  </nav>
</header>

<div class="content">
  <router-outlet></router-outlet>
</div>

<footer>
  <a [href]="imprintUrl" target="_blank" rel="noopener">{{ 'footer.imprint' | t }}</a>
  <a routerLink="/datenschutz">{{ 'footer.privacy' | t }}</a>
</footer>
