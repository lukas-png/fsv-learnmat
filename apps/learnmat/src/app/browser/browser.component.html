<div class="container">
    <div class="browser">
        <p>
            {{ 'browse.intro' | t }}
        </p>
        <div>
            <button mat-raised-button color="primary" [disabled]="loading" (click)="getLinks()">
                {{ 'browse.getLinks' | t }}
            </button>
        </div>
        
        <mat-selection-list #modulesList 
            color="primary"
            >
            <mat-list-option *ngFor="let module of modules" [value]="module.name">
                {{module.name}}
            </mat-list-option>
        </mat-selection-list>
        
        <div>
            <button mat-raised-button color="primary" [disabled]="loading" (click)="getLinks()">
                {{ 'browse.getLinks' | t }}
            </button>
        </div>
    </div>
</div>
